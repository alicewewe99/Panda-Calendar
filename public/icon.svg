<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Fairytale Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9f3" />
      <stop offset="50%" stop-color="#fef0ea" />
      <stop offset="100%" stop-color="#fbe4dd" />
    </linearGradient>

    <!-- Celestial Magic Halo Glow -->
    <radialGradient id="magicAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Magic Calendar Book Cover Gradient -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Magic Page Gradient -->
    <linearGradient id="pageGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fefce8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Gold Foil Filigree -->
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="magicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#581c87" flood-opacity="0.22" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (iOS / Android adaptive base) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#eec8be" stroke-width="4" stroke-dasharray="8,6" />

  <!-- Background Alice Storybook Emblems with Magic Dust -->
  <g opacity="0.35">
    <!-- Mini Spade -->
    <path d="M 85 95 C 68 80, 52 105, 72 125 C 82 135, 85 142, 85 142 C 85 142, 88 135, 98 125 C 118 105, 102 80, 85 95 Z M 85 138 L 79 150 L 91 150 Z" fill="#2d3748" />
    <!-- Mini Heart -->
    <path d="M 425 105 C 405 85, 385 110, 415 130 L 425 140 L 435 130 C 465 110, 445 85, 425 105 Z" fill="#e11d48" />
    <!-- Mini Diamond -->
    <polygon points="90,415 105,435 90,455 75,435" fill="#f59e0b" />
    <!-- Mini Club -->
    <circle cx="425" cy="410" r="10" fill="#2d3748"/>
    <circle cx="415" cy="423" r="10" fill="#2d3748"/>
    <circle cx="435" cy="423" r="10" fill="#2d3748"/>
    <rect x="422" y="427" width="6" height="14" fill="#2d3748"/>
  </g>

  <!-- Large Celestial Magical Halo behind Panda -->
  <circle cx="256" cy="265" r="190" fill="url(#magicAura)" />
  <!-- Golden Astrological Clock Ring -->
  <circle cx="256" cy="265" r="170" fill="#ffffff" fill-opacity="0.88" stroke="#fcd34d" stroke-width="5" filter="url(#magicShadow)" />
  <circle cx="256" cy="265" r="158" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Clock / Astrological Roman Numeral Ticks -->
  <g stroke="#d97706" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <line x1="256" y1="108" x2="256" y2="120" />
    <line x1="256" y1="410" x2="256" y2="422" />
    <line x1="99" y1="265" x2="111" y2="265" />
    <line x1="401" y1="265" x2="413" y2="265" />
  </g>

  <!-- PANDA EARS -->
  <ellipse cx="165" cy="158" rx="42" ry="42" fill="#26232a" />
  <ellipse cx="347" cy="158" rx="42" ry="42" fill="#26232a" />
  <ellipse cx="165" cy="158" rx="20" ry="20" fill="#473f50" opacity="0.5" />
  <ellipse cx="347" cy="158" rx="20" ry="20" fill="#473f50" opacity="0.5" />

  <!-- Alice in Wonderland Head Ribbon with Golden Moon Buckle -->
  <path d="M 256 118 C 215 80, 185 110, 238 132 C 248 136, 256 142, 256 142 C 256 142, 264 136, 274 132 C 327 110, 297 80, 256 118 Z" fill="#1e1b4b" />
  <circle cx="256" cy="136" r="10" fill="url(#goldFiligree)" />
  <path d="M 256 130 C 259 133, 259 139, 256 142 C 253 140, 253 133, 256 130 Z" fill="#ffffff" />

  <!-- White Rabbit Ear Headband Peek behind Ribbon -->
  <path d="M 228 128 C 223 65, 240 50, 246 118 Z" fill="#ffffff" stroke="#fbcfe8" stroke-width="3" />
  <path d="M 231 123 C 228 78, 237 68, 242 118 Z" fill="#f472b6" opacity="0.6" />
  <path d="M 284 128 C 289 65, 272 50, 266 118 Z" fill="#ffffff" stroke="#fbcfe8" stroke-width="3" />
  <path d="M 281 123 C 284 78, 275 68, 270 118 Z" fill="#f472b6" opacity="0.6" />

  <!-- Magical Little Star Crown on Right Ear -->
  <g transform="translate(350, 125) rotate(22)">
    <polygon points="0,-16 6,-4 18,-4 9,4 12,16 0,8 -12,16 -9,4 -18,-4 -6,-4" fill="url(#goldFiligree)" />
  </g>

  <!-- PANDA HEAD -->
  <ellipse cx="256" cy="238" rx="104" ry="94" fill="#ffffff" stroke="#f3d5cb" stroke-width="3" />

  <!-- PANDA EYE PATCHES -->
  <!-- Left Eye Patch -->
  <ellipse cx="214" cy="228" rx="26" ry="32" transform="rotate(-15, 214, 228)" fill="#26232a" />
  <!-- Left Eye Sparkles -->
  <circle cx="217" cy="227" r="10" fill="#ffffff" />
  <circle cx="219" cy="225" r="4.5" fill="#18141e" />
  <circle cx="221" cy="223" r="2.5" fill="#ffffff" />
  <circle cx="214" cy="232" r="1.5" fill="#ffffff" />

  <!-- Right Eye Patch -->
  <ellipse cx="298" cy="228" rx="26" ry="32" transform="rotate(15, 298, 228)" fill="#26232a" />
  <!-- Right Eye Sparkles -->
  <circle cx="295" cy="227" r="10" fill="#ffffff" />
  <circle cx="293" cy="225" r="4.5" fill="#18141e" />
  <circle cx="295" cy="223" r="2.5" fill="#ffffff" />
  <circle cx="299" cy="232" r="1.5" fill="#ffffff" />

  <!-- Rosy Cheeks -->
  <ellipse cx="186" cy="264" rx="18" ry="11" fill="#f472b6" opacity="0.55" />
  <ellipse cx="326" cy="264" rx="18" ry="11" fill="#f472b6" opacity="0.55" />

  <!-- Panda Nose & Smiling Sweet Mouth -->
  <ellipse cx="256" cy="250" rx="11" ry="8" fill="#26232a" />
  <path d="M 256 258 L 256 267 M 256 267 Q 248 277 241 270 M 256 267 Q 264 277 271 270" stroke="#26232a" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- ALICE BLUE DRESS & WHITE PINAFORE APRON -->
  <path d="M 175 324 Q 256 308 337 324 L 380 460 Q 256 478 132 460 Z" fill="#38bdf8" />
  <!-- White Pinafore Apron -->
  <path d="M 198 324 Q 256 318 314 324 L 336 460 Q 256 470 176 460 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <!-- Apron Fairytale Emblem -->
  <path d="M 256 340 C 250 332, 238 336, 244 346 L 256 356 L 268 346 C 274 336, 262 332, 256 340 Z" fill="#f43f5e" />

  <!-- PANDA BLACK ARMS HOLDING THE MAGICAL CALENDAR -->
  <ellipse cx="162" cy="374" rx="28" ry="46" transform="rotate(32, 162, 374)" fill="#26232a" />
  <ellipse cx="350" cy="374" rx="28" ry="46" transform="rotate(-32, 350, 374)" fill="#26232a" />

  <!-- ================= THE ENCHANTED MAGICAL CALENDAR (魔法月曆) ================= -->
  <!-- Glowing Aura behind Magic Calendar -->
  <ellipse cx="256" cy="398" rx="105" ry="75" fill="#fef08a" opacity="0.65" filter="url(#softGlow)" />

  <!-- Magic Calendar Grimoire Base -->
  <g filter="url(#magicShadow)">
    <!-- Deep Cosmic Violet / Sapphire Leather Book Cover -->
    <path d="M 152 342 Q 256 332 360 342 L 372 458 Q 256 472 140 458 Z" fill="url(#bookCover)" stroke="url(#goldFiligree)" stroke-width="4" />

    <!-- Ornate Golden Corner Protectors -->
    <polygon points="152,342 174,342 152,364" fill="url(#goldFiligree)" />
    <polygon points="360,342 338,342 360,364" fill="url(#goldFiligree)" />
    <polygon points="140,458 162,458 140,436" fill="url(#goldFiligree)" />
    <polygon points="372,458 350,458 372,436" fill="url(#goldFiligree)" />

    <!-- Glowing Parchment Calendar Pages -->
    <path d="M 160 348 Q 256 340 352 348 L 362 448 Q 256 460 150 448 Z" fill="url(#pageGlow)" stroke="#fcd34d" stroke-width="2" />
    <!-- Book Center Fold / Spine Crease -->
    <line x1="256" y1="340" x2="256" y2="460" stroke="#f59e0b" stroke-width="2" opacity="0.7" />

    <!-- Calendar Top Binding Ring Spiral (Golden rings) -->
    <g fill="#f59e0b" stroke="#78350f" stroke-width="1">
      <rect x="180" y="336" width="6" height="14" rx="3" />
      <rect x="210" y="334" width="6" height="14" rx="3" />
      <rect x="240" y="333" width="6" height="14" rx="3" />
      <rect x="266" y="333" width="6" height="14" rx="3" />
      <rect x="296" y="334" width="6" height="14" rx="3" />
      <rect x="326" y="336" width="6" height="14" rx="3" />
    </g>

    <!-- Header Banner on Calendar: ✦ 魔法月曆 ✦ -->
    <path d="M 172 355 Q 256 348 340 355 L 336 376 Q 256 370 176 376 Z" fill="#f43f5e" />
    <text x="256" y="370" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="3">✦ 魔法月曆 ✦</text>

    <!-- Calendar Left Page: Magical Constellation & Year 2026-2033 -->
    <g transform="translate(170, 385)">
      <!-- Mini Glowing Date Grid -->
      <circle cx="15" cy="15" r="6" fill="#fbcfe8" />
      <circle cx="32" cy="15" r="6" fill="#fde047" />
      <circle cx="49" cy="15" r="6" fill="#bae6fd" />
      <circle cx="66" cy="15" r="7" fill="#f43f5e" /> <!-- Highlighted holiday -->
      <text x="66" y="19" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">★</text>

      <circle cx="15" cy="32" r="6" fill="#e2e8f0" />
      <circle cx="32" cy="32" r="7" fill="#3b82f6" />
      <circle cx="49" cy="32" r="6" fill="#e2e8f0" />
      <circle cx="66" cy="32" r="6" fill="#fbcfe8" />

      <text x="40" y="55" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">2026~2033</text>
    </g>

    <!-- Calendar Right Page: Huge Glowing Star & Magic Crystal Spell -->
    <g transform="translate(256, 385)">
      <!-- Giant Glowing Magical Star -->
      <g transform="translate(42, 28)">
        <polygon points="0,-22 6,-6 22,-6 10,4 15,20 0,10 -15,20 -10,4 -22,-6 -6,-6" fill="url(#goldFiligree)" filter="url(#softGlow)" />
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
      </g>
      <!-- Magical Celestial Text -->
      <text x="42" y="55" font-family="sans-serif" font-size="9.5" font-weight="900" fill="#db2777" text-anchor="middle">✨ 吉 日 順 遂 ✨</text>
    </g>

    <!-- Golden Ribbon Bookmark with Fairytale Key Hanging down -->
    <path d="M 256 352 Q 252 420 256 470 L 266 478 L 260 470 Q 260 420 258 352 Z" fill="#f59e0b" />
    <circle cx="260" cy="482" r="5" fill="url(#goldFiligree)" />
    <rect x="258" y="486" width="3" height="8" fill="url(#goldFiligree)" />
    <rect x="261" y="490" width="4" height="2" fill="url(#goldFiligree)" />
  </g>

  <!-- PANDA PAWS HOLDING THE CALENDAR FIRMLY -->
  <!-- Left Paw -->
  <ellipse cx="178" cy="420" rx="19" ry="16" transform="rotate(-10, 178, 420)" fill="#26232a" stroke="#3d3744" stroke-width="2" />
  <circle cx="172" cy="417" r="3" fill="#473f50" />
  <circle cx="178" cy="415" r="3" fill="#473f50" />
  <circle cx="184" cy="417" r="3" fill="#473f50" />

  <!-- Right Paw -->
  <ellipse cx="334" cy="420" rx="19" ry="16" transform="rotate(10, 334, 420)" fill="#26232a" stroke="#3d3744" stroke-width="2" />
  <circle cx="328" cy="417" r="3" fill="#473f50" />
  <circle cx="334" cy="415" r="3" fill="#473f50" />
  <circle cx="340" cy="417" r="3" fill="#473f50" />

  <!-- MAGICAL FLOATING SPARKLES & ENCHANTED STARDUST -->
  <!-- Floating Magic Sparkle 1 (Top Left) -->
  <g fill="#f59e0b" filter="url(#softGlow)">
    <path d="M 115 195 Q 120 180 132 186 Q 120 192 115 208 Q 110 192 98 186 Q 110 180 115 195 Z" />
    <circle cx="140" cy="180" r="3" fill="#38bdf8" />
    <circle cx="95" cy="205" r="2.5" fill="#ec4899" />
  </g>

  <!-- Floating Magic Sparkle 2 (Top Right) -->
  <g fill="#ec4899" filter="url(#softGlow)">
    <path d="M 395 198 Q 400 186 410 190 Q 400 196 395 208 Q 390 196 380 190 Q 390 186 395 198 Z" />
    <circle cx="375" cy="182" r="3" fill="#facc15" />
    <circle cx="418" cy="205" r="2.5" fill="#a855f7" />
  </g>

  <!-- Floating Magic Sparkle 3 (Bottom Center Aura) -->
  <g fill="#facc15" filter="url(#softGlow)">
    <path d="M 256 324 Q 259 316 266 319 Q 259 322 256 330 Q 253 322 246 319 Q 253 316 256 324 Z" />
    <circle cx="142" cy="340" r="3.5" fill="#f43f5e" />
    <circle cx="370" cy="340" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Tiny Magic Wand Starlight at bottom right of calendar -->
  <g transform="translate(378, 435) rotate(45)">
    <line x1="0" y1="0" x2="0" y2="28" stroke="url(#goldFiligree)" stroke-width="3" stroke-linecap="round" />
    <polygon points="0,-7 3,-2 8,-2 4,2 6,7 0,3 -6,7 -4,2 -8,-2 -3,-2" fill="#fef08a" />
  </g>
</svg>
